name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: coderexic
          POSTGRES_PASSWORD: coderexic
          POSTGRES_DB: coderexic
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U coderexic -d coderexic"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://coderexic:coderexic@localhost:5432/coderexic
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:integration
      - name: Migrations match the schema
        run: pnpm db:generate && test -z "$(git status --porcelain packages/core/drizzle)"
      - run: pnpm build

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: docker build --target api -t coderexic-api .
      - run: docker build --target worker -t coderexic-worker .
