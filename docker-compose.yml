# Local and early-production stack: Postgres, Redis, API and worker.
# Infrastructure only (for `pnpm dev:*`):  docker compose up -d postgres redis
# Everything:                               docker compose up --build
# The one-shot `migrate` service applies database migrations before the api
# and worker start; locally without Docker, run `pnpm db:migrate`.

x-app-env: &app-env
  NODE_ENV: production
  LOG_LEVEL: ${LOG_LEVEL:-info}
  DATABASE_URL: postgres://coderexic:${POSTGRES_PASSWORD:-coderexic}@postgres:5432/coderexic
  REDIS_URL: redis://redis:6379

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: coderexic
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-coderexic}
      POSTGRES_DB: coderexic
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U coderexic -d coderexic']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '127.0.0.1:${REDIS_PORT:-6379}:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build:
      context: .
      target: api
    command: ['node', 'dist/migrate.js']
    environment:
      <<: *app-env
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  api:
    build:
      context: .
      target: api
    environment:
      <<: *app-env
      PORT: 3000
      # Required: the API refuses to start without it.
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-}
    ports:
      - '127.0.0.1:${API_PORT:-3000}:3000'
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build:
      context: .
      target: worker
    environment:
      <<: *app-env
      GITHUB_APP_ID: ${GITHUB_APP_ID:-}
      # GITHUB_PRIVATE_KEY_PATH (a host path) isn't usable in the container;
      # the host file, if set, is bind-mounted read-only below instead.
      GITHUB_PRIVATE_KEY_PATH: /run/secrets/github-app.pem
      # Set only if the key is provided inline instead (e.g. from a secret manager).
      GITHUB_PRIVATE_KEY: ${GITHUB_PRIVATE_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-}
      # Optional (Phase 13c) - repo-level BYOK is silently skipped without
      # it, not an error. If set, must be the exact same value apps/web
      # uses to encrypt (apps/web isn't containerized yet - see ROADMAP.md
      # Phase 13a - so that's still set outside this file for now).
      MODEL_CREDENTIALS_MASTER_KEYS: ${MODEL_CREDENTIALS_MASTER_KEYS:-}
      MODEL_CREDENTIALS_KEY_VERSION: ${MODEL_CREDENTIALS_KEY_VERSION:-}
    volumes:
      - ${GITHUB_PRIVATE_KEY_PATH:-/dev/null}:/run/secrets/github-app.pem:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
